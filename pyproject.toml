[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pipecat-ru"
dynamic = ["version"]
description = "Russian-language plugins for Pipecat: GigaAM STT, Qwen3-TTS and Silero TTS, a Russian text normalizer, a fast-first-chunk sentence splitter and a backchannel-aware interruption strategy."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
authors = [{ name = "mustikon" }]
keywords = ["pipecat", "russian", "voice-assistant", "stt", "tts", "gigaam", "qwen3-tts", "silero", "ruaccent", "speech"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: Russian",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio :: Speech",
    "Typing :: Typed",
]
# The core is light on purpose: the model runtimes (torch, GigaAM, Qwen3-TTS, Silero,
# ruaccent) live in extras, so the text tools and turn strategy install anywhere.
dependencies = [
    "pipecat-ai>=1.16,<2",
    "numpy>=1.26",
    "rutextnorm>=2.1,<3",
]

[project.optional-dependencies]
# GigaAM v3 is not on PyPI (the `gigaam` name there is an old v1 build). Install it
# from GitHub on top of this extra; see the README.
gigaam = ["torch>=2.5"]
qwen = ["qwen-tts>=0.1.1", "torch>=2.5"]
silero = ["silero>=0.5.5", "torch>=2.5"]
accent = ["ruaccent>=1.5.8"]
# Smart-turn v3.2 (Russian) and Silero VAD run on pipecat-ai's core onnxruntime
# dependency, so no extra is needed for them. Do not add pipecat-ai[local-smart-turn]:
# it needs transformers>=5, while qwen-tts pins transformers==4.57.3.

[project.scripts]
pipecat-ru-bench = "pipecat_ru.bench:main"

[project.urls]
Homepage = "https://github.com/mustikon/pipecat-ru"
Issues = "https://github.com/mustikon/pipecat-ru/issues"
Changelog = "https://github.com/mustikon/pipecat-ru/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]

[tool.hatch.version]
path = "src/pipecat_ru/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/pipecat_ru"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "examples", "README.md", "README.ru.md", "CHANGELOG.md", "LICENSE"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
    "gpu: needs a CUDA GPU and downloads the real models (opt in with PIPECAT_RU_GPU_TESTS=1)",
]
filterwarnings = [
    "ignore::DeprecationWarning:pipecat.*",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC", "S"]
ignore = [
    "S101",  # asserts narrow types
    "RUF001", "RUF002", "RUF003",  # Cyrillic letters in strings and comments are intended
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S108", "E501", "RUF012"]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "examples"]
# pipecat-ai ships py.typed but leaves some methods unannotated (__init_subclass__,
# cleanup...); calling them is fine.
untyped_calls_exclude = ["pipecat"]

[[tool.mypy.overrides]]
module = ["torch.*", "gigaam.*", "qwen_tts.*", "silero.*", "ruaccent.*", "rutextnorm.*", "soundfile.*"]
ignore_missing_imports = true
